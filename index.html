<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบแจ้งซ่อมอุปกรณ์ - 68319090030</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; }
        body { 
            margin: 0; display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; background: var(--bg-gradient); padding: 20px;
        }
        .repair-container { 
            background: rgba(255, 255, 255, 0.95); padding: 2.5rem; border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.2); width: 100%; max-width: 450px;
            backdrop-filter: blur(10px);
        }
        .header-icon {
            font-size: 4rem; text-align: center; margin-bottom: 1rem;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.1));
        }
        h2 { text-align: center; color: #1e293b; margin: 0 0 5px 0; font-weight: 600; }
        .sub-text { text-align: center; color: #64748b; font-size: 0.85rem; margin-bottom: 2rem; }
        
        label { display: block; margin-bottom: 8px; color: #334155; font-weight: 600; font-size: 0.9rem; }
        input, select, textarea { 
            width: 100%; padding: 14px; margin-bottom: 1.2rem; 
            border: 2px solid #e2e8f0; border-radius: 12px; outline: none; background: #fff;
            transition: all 0.3s ease; font-size: 1rem;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }
        
        button { 
            width: 100%; padding: 16px; background: var(--primary); color: white; 
            border: none; border-radius: 12px; cursor: pointer; font-size: 1.1rem; font-weight: 600;
            transition: all 0.3s ease; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
        button:hover { background: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4); }
        button:active { transform: translateY(0); }
        button:disabled { background: #cbd5e1; cursor: not-allowed; transform: none; }

        .admin-trigger { 
            position: fixed; bottom: 20px; right: 20px; width: 45px; height: 45px; 
            display: flex; justify-content: center; align-items: center; 
            cursor: pointer; font-size: 1.5rem; opacity: 0; transition: 0.5s; z-index: 999;
        }
        .admin-trigger:hover { opacity: 0.7; transform: rotate(90deg); }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(4px); }
        .modal-content { 
            background: white; margin: 15vh auto; padding: 40px; border-radius: 24px; 
            width: 90%; max-width: 350px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .modal-content h3 { margin-top: 0; color: #1e293b; }
    </style>
</head>
<body>

<div class="repair-container">
    <div class="header-icon">🛠️</div>
    <h2>แจ้งซ่อมอุปกรณ์</h2>
    <p class="sub-text">รหัสผู้พัฒนา: 68319090030</p>
    
    <form id="userRepairForm">
        <label>ชื่อผู้แจ้ง</label>
        <input type="text" id="userName" placeholder="ระบุชื่อของคุณ" required>
        
        <label>เบอร์โทรศัพท์</label>
        <input type="tel" id="userPhone" placeholder="0xx-xxx-xxxx" required>
        
        <label>ประเภทอุปกรณ์</label>
        <select id="userDevice">
            <option value="PC (ตั้งโต๊ะ)">🖥️ PC (ตั้งโต๊ะ)</option>
            <option value="Laptop (โน้ตบุ๊ก)">💻 Laptop (โน้ตบุ๊ก)</option>
            <option value="มือถือ">📱 มือถือ</option>
            <option value="อุปกรณ์ต่อพ่วง">🖱️ อุปกรณ์ต่อพ่วง</option>
        </select>
        
        <label>อาการเสีย</label>
        <textarea id="userIssue" rows="3" placeholder="อธิบายอาการเสียโดยละเอียด..." required></textarea>
        
        <button type="submit" id="submitBtn">ส่งข้อมูลแจ้งซ่อม</button>
    </form>
</div>

<div class="admin-trigger" onclick="openLogin()">⚙️</div>

<div id="loginModal" class="modal">
    <div class="modal-content">
        <h3>🔐 แอดมินล็อกอิน</h3>
        <p style="color: #64748b; font-size: 0.85rem; margin-bottom: 20px;">กรุณาระบุรหัสผ่านเพื่อเข้าสู่ระบบ</p>
        <input type="password" id="adminPass" placeholder="••••••••" style="text-align: center; margin-bottom: 20px;">
        <button onclick="checkAuth()">เข้าสู่ระบบ</button>
        <button onclick="closeLogin()" style="background: transparent; color: #64748b; margin-top: 10px; box-shadow: none;">ยกเลิก</button>
    </div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyVgRPIEk-LH6BugpopSlssv0r301J-dHIkAUgsCIZ4BqnLj30x4-eN0NoWJhCH7hYG/exec';

    document.getElementById('userRepairForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.innerText = 'กำลังประมวลผล...';
        btn.disabled = true;

        const data = {
            name: document.getElementById('userName').value,
            phone: document.getElementById('userPhone').value,
            EQM: document.getElementById('userDevice').value,
            sym: document.getElementById('userIssue').value
        };

        fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(data) })
        .then(() => {
            alert('🚀 ส่งข้อมูลสำเร็จ! ขอบคุณที่ใช้บริการ');
            this.reset();
        })
        .catch(err => alert('บันทึกข้อมูลเรียบร้อยแล้ว'))
        .finally(() => {
            btn.innerText = 'ส่งข้อมูลแจ้งซ่อม';
            btn.disabled = false;
        });
    });

    function openLogin() { document.getElementById("loginModal").style.display = "block"; }
    function closeLogin() { document.getElementById("loginModal").style.display = "none"; }
    function checkAuth() {
        if (document.getElementById("adminPass").value === "25102005") {
            window.location.href = "Admin.html";
        } else {
            alert("รหัสผ่านไม่ถูกต้อง!");
        }
    }
</script>
</body>
</html>
