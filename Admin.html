<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการการแจ้งซ่อม - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --sidebar: #1e293b; --primary: #6366f1; --success: #10b981; --warning: #f59e0b; --danger: #ef4444; }
        * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; }
        body { margin: 0; background: #f1f5f9; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar Design */
        .sidebar { width: 260px; background: var(--sidebar); color: white; display: flex; flex-direction: column; padding: 25px; transition: 0.3s; }
        .nav-item { padding: 12px 15px; border-radius: 10px; cursor: pointer; color: #94a3b8; margin-bottom: 8px; transition: 0.3s; display: flex; align-items: center; gap: 10px; }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.1); color: white; }
        
        /* Main Content */
        .main { flex: 1; padding: 40px; overflow-y: auto; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; border: 1px solid #e2e8f0; }
        .stat-card h3 { margin: 10px 0 0 0; font-size: 2rem; }
        
        /* Table Design */
        .table-container { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 10px 15px rgba(0,0,0,0.05); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th { background: #f8fafc; padding: 15px; text-align: left; color: #64748b; border-bottom: 2px solid #e2e8f0; font-weight: 600; }
        td { padding: 15px; border-bottom: 1px solid #f1f5f9; color: #334155; }
        
        /* Status Badges */
        .status-select { padding: 8px 12px; border-radius: 10px; font-size: 0.85rem; font-weight: 700; border: 1px solid transparent; cursor: pointer; outline: none; }
        .badge-wait { background: #fef3c7; color: #b45309; border-color: #fde68a; }
        .badge-done { background: #dcfce7; color: #15803d; border-color: #bcf0da; }
        .badge-fail { background: #fee2e2; color: #b91c1c; border-color: #fecaca; }
        
        /* Buttons */
        .btn-send { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; transition: 0.2s; font-weight: 600; display: flex; align-items: center; gap: 5px; }
        .btn-send:hover { background: #4f46e5; transform: translateY(-2px); }
        .refresh-btn { background: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 12px; cursor: pointer; font-weight: 600; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .refresh-btn:disabled { background: #94a3b8; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2 style="margin-bottom: 30px;"><i class="fa-solid fa-tools"></i> Admin Panel</h2>
    <div id="nav-main" class="nav-item active" onclick="switchPage('main')"><i class="fa-solid fa-screwdriver-wrench"></i> งานซ่อมปัจจุบัน</div>
    <div id="nav-history" class="nav-item" onclick="switchPage('history')"><i class="fa-solid fa-clipboard-check"></i> ประวัติการซ่อมสำเร็จ</div>
    <div class="nav-item" onclick="window.open('https://docs.google.com/spreadsheets/d/11UR1jOdk9Y-kwnladUPyo_svZYIlDpQEbfACpUgieWU/edit')"><i class="fa-solid fa-table"></i> Google Sheets</div>
    <button onclick="alert('ออกจากระบบสำเร็จ')" style="margin-top:auto; background:#ef4444; border:none; color:white; padding:12px; border-radius:10px; cursor:pointer; font-weight:600">ออกจากระบบ</button>
</div>

<div class="main">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
        <h2 id="pageTitle" style="margin:0; color:#1e293b;">งานที่กำลังดำเนินการ</h2>
        <button id="updateBtn" class="refresh-btn" onclick="loadData()">🔄 <span id="btnText">อัปเดตข้อมูล</span></button>
    </div>
    
    <div id="statsGrid" class="stats-grid">
        <div class="stat-card">งานทั้งหมด<h3 id="total">0</h3></div>
        <div class="stat-card">รอดำเนินการ<h3 id="pending" style="color:var(--warning)">0</h3></div>
        <div class="stat-card">เสร็จสิ้น<h3 id="done" style="color:var(--success)">0</h3></div>
        <div class="stat-card">ซ่อมไม่ได้<h3 id="failed" style="color:var(--danger)">0</h3></div>
    </div>

    <div class="table-container">
        <table id="dataTable">
            <thead id="thead"></thead>
            <tbody id="tbody">
                <tr><td colspan="7" style="text-align:center; padding: 60px; color: #64748b;">⏳ กำลังเชื่อมต่อข้อมูล...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxjGRktXQ81HLFP818MGCn3VM1H1JTGErYYYwVrN9djABynL2LYPeJJRntWSdv2LVcz/exec';
    let currentPage = 'main';

    function switchPage(page) {
        currentPage = page;
        document.getElementById('nav-main').classList.toggle('active', page === 'main');
        document.getElementById('nav-history').classList.toggle('active', page === 'history');
        document.getElementById('pageTitle').innerText = page === 'main' ? 'งานที่กำลังดำเนินการ' : 'ประวัติการซ่อมสำเร็จ/ซ่อมไม่ได้';
        document.getElementById('statsGrid').style.display = page === 'main' ? 'grid' : 'none';
        loadData();
    }

    function getStatusClass(status) {
        if (status.includes("เสร็จ")) return "badge-done";
        if (status.includes("ไม่ได้")) return "badge-fail";
        return "badge-wait";
    }

    // ฟังก์ชันจัดรูปแบบวันที่แบบไทย พ.ศ.
    function formatThaiDate(val) {
        if (!val || val === "" || val === "-") return "-";
        const date = new Date(val);
        if (isNaN(date.getTime())) return val;
        return new Intl.DateTimeFormat('th-TH', {
            day: '2-digit', month: '2-digit', year: 'numeric',
            hour: '2-digit', minute: '2-digit', hour12: false
        }).format(date) + " น.";
    }

    async function loadData() {
        const btn = document.getElementById('updateBtn');
        const btnText = document.getElementById('btnText');
        btn.disabled = true;
        btnText.innerText = "กำลังโหลด...";

        try {
            const res = await fetch(`${SCRIPT_URL}?page=${currentPage}`);
            const data = await res.json();
            
            const headers = (data.length > 0) ? Object.keys(data[0]).filter(h => h !== "rowId") : [];
            document.getElementById('thead').innerHTML = `<tr>${headers.map(h => `<th>${h}</th>`).join('')}${currentPage === 'main' ? '<th>จัดการ</th>' : ''}</tr>`;

            let pending = 0, done = 0, failed = 0;
            const rows = data.map(item => {
                const status = String(item["สถานะ"] || "");
                if (status.includes("เสร็จ")) done++; else if (status.includes("ไม่ได้")) failed++; else pending++;
                
                // กรองข้อมูลแยกหน้า
                if (currentPage === 'history' && !status.includes("เสร็จ") && !status.includes("ไม่ได้")) return "";
                if (currentPage === 'main' && (status.includes("เสร็จ") || status.includes("ไม่ได้"))) return "";

                let rowHtml = headers.map(h => {
                    let val = item[h];
                    if (h.includes("วันที่") || h.includes("เวลา")) val = formatThaiDate(val);

                    if (h === "สถานะ") {
                        const cls = getStatusClass(val);
                        if (currentPage === 'history') return `<td><span class="status-select ${cls}">${val}</span></td>`;
                        return `<td>
                            <select class="status-select ${cls}" onchange="updateStatus(this, ${item.rowId})">
                                <option value="รอดำเนินการ" ${val.includes('รอ') ? 'selected' : ''}>⏳ รอดำเนินการ</option>
                                <option value="เสร็จสิ้น" ${val.includes('เสร็จ') ? 'selected' : ''}>✅ เสร็จสิ้น</option>
                                <option value="ไม่สามารถซ่อมได้" ${val.includes('ไม่ได้') ? 'selected' : ''}>❌ ไม่สามารถซ่อมได้</option>
                            </select>
                        </td>`;
                    }
                    return `<td>${val}</td>`;
                }).join('');

                const action = currentPage === 'main' ? `<td><button class="btn-send" onclick="archiveRow(${item.rowId})"><i class="fa-solid fa-paper-plane"></i> ส่ง</button></td>` : '';
                return `<tr>${rowHtml}${action}</tr>`;
            }).join('');

            document.getElementById('tbody').innerHTML = rows || '<tr><td colspan="10" style="text-align:center; padding:30px;">ไม่มีข้อมูล</td></tr>';
            document.getElementById('total').innerText = data.length;
            document.getElementById('pending').innerText = pending;
            document.getElementById('done').innerText = done;
            document.getElementById('failed').innerText = failed;

        } catch (e) {
            document.getElementById('tbody').innerHTML = '<tr><td colspan="10" style="color:red; text-align:center; padding:30px;">❌ เชื่อมต่อผิดพลาด โปรดตรวจสอบการ Deploy</td></tr>';
        }
        btn.disabled = false;
        btnText.innerText = "อัปเดตข้อมูล";
    }

    async function updateStatus(el, id) {
        el.style.opacity = "0.5";
        await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'update', rowId: id, newStatus: el.value }) });
        setTimeout(loadData, 800);
    }

    async function archiveRow(id) {
        if (!confirm("ต้องการบันทึกและย้ายข้อมูลนี้ไปยังหน้าประวัติใช่หรือไม่?")) return;
        await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'delete', rowId: id }) });
        setTimeout(loadData, 800);
    }

    loadData();
</script>
</body>
</html>
