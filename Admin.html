<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - 68319090030</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --sidebar: #1e293b; --primary: #6366f1; --success: #10b981; --warning: #f59e0b; }
        * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; }
        body { margin: 0; background: #f1f5f9; display: flex; height: 100vh; }
        .sidebar { width: 260px; background: var(--sidebar); color: white; display: flex; flex-direction: column; padding: 25px; }
        .main { flex: 1; padding: 40px; overflow-y: auto; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; border: 1px solid #e2e8f0; }
        .stat-card h3 { margin: 10px 0 0 0; font-size: 2.2rem; }
        .table-container { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 10px 15px rgba(0,0,0,0.05); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th { background: #f8fafc; padding: 15px; text-align: left; color: #64748b; border-bottom: 2px solid #e2e8f0; }
        td { padding: 15px; border-bottom: 1px solid #f1f5f9; color: #334155; }
        .badge { padding: 6px 12px; border-radius: 10px; font-size: 0.8rem; font-weight: 700; }
        .badge-wait { background: #fef3c7; color: #b45309; }
        .badge-done { background: #dcfce7; color: #15803d; }
        .refresh-btn { background: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 12px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .refresh-btn:hover { transform: scale(1.05); background: #4f46e5; }
    </style>
</head>
<body>
<div class="sidebar">
    <h2 style="margin-bottom: 30px;">🛠 Admin Panel</h2>
    <div style="cursor:pointer; padding: 10px 0; color:#94a3b8" onclick="location.reload()">🏠 แดชบอร์ด</div>
    <div style="cursor:pointer; padding: 10px 0; color:#94a3b8" onclick="window.open('https://docs.google.com/spreadsheets/d/11UR1jOdk9Y-kwnladUPyo_svZYIlDpQEbfACpUgieWU/edit')">📊 เปิด Google Sheets</div>
    <button onclick="location.href='index.html'" style="margin-top:auto; background:#ef4444; border:none; color:white; padding:12px; border-radius:10px; cursor:pointer; font-weight:600">ออกจากระบบ</button>
</div>
<div class="main">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
        <h2 style="margin:0; color:#1e293b;">ข้อมูลการแจ้งซ่อมทั้งหมด</h2>
        <button class="refresh-btn" onclick="loadData()">🔄 อัปเดตข้อมูล</button>
    </div>
    <div class="stats-grid">
        <div class="stat-card">งานทั้งหมด<h3 id="total">0</h3></div>
        <div class="stat-card">รอดำเนินการ<h3 id="pending" style="color:var(--warning)">0</h3></div>
        <div class="stat-card">เสร็จสิ้น<h3 id="done" style="color:var(--success)">0</h3></div>
    </div>
    <div class="table-container">
        <table id="dataTable">
            <thead id="thead"></thead>
            <tbody id="tbody"><tr><td colspan="6" style="text-align:center; padding: 40px;">⏳ กำลังโหลดข้อมูล...</td></tr></tbody>
        </table>
    </div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzpHhsONAW8-6UlLIOPeBXOqg_uiy_5CINsfwr95wNjSr16zvNnQHX_-6J-slgt-Ll6/exec';

    async function loadData() {
        try {
            const res = await fetch(SCRIPT_URL);
            const data = await res.json();
            if(!data || data.length === 0) {
                document.getElementById('tbody').innerHTML = '<tr><td colspan="6" style="text-align:center">ไม่มีข้อมูล</td></tr>';
                return;
            }

            const headers = Object.keys(data[0]);
            document.getElementById('thead').innerHTML = `<tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr>`;

            let pending = 0, done = 0;
            const rows = data.reverse().map(item => {
                const status = String(item["สถานะ"] || "");
                if(status.includes("เสร็จ")) done++; else pending++;
                
                return `<tr>${headers.map(h => {
                    let val = item[h];
                    if(h === "สถานะ") {
                        let cls = val.includes("เสร็จ") ? "badge-done" : "badge-wait";
                        return `<td><span class="badge ${cls}">${val}</span></td>`;
                    }
                    if(h === "วันที่") return `<td>${new Date(val).toLocaleString('th-TH')}</td>`;
                    return `<td>${val}</td>`;
                }).join('')}</tr>`;
            }).join('');

            document.getElementById('tbody').innerHTML = rows;
            document.getElementById('total').innerText = data.length;
            document.getElementById('pending').innerText = pending;
            document.getElementById('done').innerText = done;
        } catch(e) { 
            document.getElementById('tbody').innerHTML = '<tr><td colspan="6" style="text-align:center;color:red">โหลดข้อมูลไม่สำเร็จ</td></tr>';
        }
    }
    loadData();
</script>
</body>
</html>
