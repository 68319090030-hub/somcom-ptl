<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - ระบบจัดการงานซ่อม</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --sidebar: #1e293b; --primary: #6366f1; --success: #10b981; --warning: #f59e0b; --danger: #ef4444; }
        * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; }
        body { margin: 0; background: #f8fafc; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 260px; background: var(--sidebar); color: white; display: flex; flex-direction: column; }
        .sidebar-header { padding: 40px 20px; text-align: center; background: rgba(0,0,0,0.2); font-weight: 600; font-size: 1.2rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-menu { list-style: none; padding: 20px 0; flex-grow: 1; }
        .sidebar-menu li { padding: 15px 25px; cursor: pointer; transition: 0.2s; color: #94a3b8; border-left: 4px solid transparent; }
        .sidebar-menu li:hover { background: #334155; color: white; border-left: 4px solid var(--primary); }
        .btn-logout { background: var(--danger); border: none; color: white; padding: 15px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .btn-logout:hover { background: #dc2626; }
        
        .main { flex-grow: 1; overflow-y: auto; padding: 40px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; margin-bottom: 40px; }
        .stat-card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; position: relative; overflow: hidden; }
        .stat-card::after { content: ""; position: absolute; left: 0; top: 0; height: 100%; width: 5px; background: var(--primary); }
        .stat-card.pending::after { background: var(--warning); }
        .stat-card.success::after { background: var(--success); }
        .stat-card p { margin: 0; color: #64748b; font-size: 0.9rem; font-weight: 600; text-transform: uppercase; }
        .stat-card h3 { margin: 10px 0 0 0; font-size: 2.5rem; color: var(--sidebar); }
        
        .table-container { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 10px 15px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th { text-align: left; padding: 15px; color: #64748b; border-bottom: 2px solid #f1f5f9; font-weight: 600; background: #fafafa; }
        td { padding: 18px 15px; border-bottom: 1px solid #f1f5f9; color: #334155; font-size: 0.95rem; }
        
        .badge { padding: 6px 14px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; display: inline-block; }
        .badge-pending { background: #fef3c7; color: #b45309; }
        .badge-success { background: #dcfce7; color: #15803d; }
        
        .refresh-btn { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 12px; cursor: pointer; font-weight: 600; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .refresh-btn:hover { background: #4f46e5; transform: translateY(-2px); }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">🛠 Admin Dashboard</div>
    <ul class="sidebar-menu">
        <li onclick="location.reload()">🏠 หน้าหลัก Dashboard</li>
        <li onclick="window.open('https://docs.google.com/spreadsheets/d/11UR1jOdk9Y-kwnladUPyo_svZYIlDpQEbfACpUgieWU/edit')">📊 เปิด Google Sheets</li>
    </ul>
    <button class="btn-logout" onclick="logout()">🚪 ออกจากระบบ</button>
</div>

<div class="main">
    <div class="top-bar">
        <h2 style="margin:0; color:#1e293b;">ข้อมูลการแจ้งซ่อมล่าสุด</h2>
        <button class="refresh-btn" onclick="fetchData()"><span>🔄</span> อัปเดตข้อมูล</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <p>รายการทั้งหมด</p>
            <h3 id="totalCount">0</h3>
        </div>
        <div class="stat-card pending">
            <p>รอดำเนินการ</p>
            <h3 id="pendingCount">0</h3>
        </div>
        <div class="stat-card success">
            <p>ดำเนินการแล้ว</p>
            <h3 id="successCount">0</h3>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead id="thead"></thead>
            <tbody id="tbody">
                <tr><td colspan="10" style="text-align:center; padding: 50px; color:#64748b;">⏳ กำลังโหลดข้อมูลจาก Google Sheets...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // ตรวจสอบ URL นี้ให้ดีว่าตรงกับหน้า Deploy ล่าสุด (ที่ลงท้ายด้วย /exec)
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyVgRPIEk-LH6BugpopSlssv0r301J-dHIkAUgsCIZ4BqnLj30x4-eN0NoWJhCH7hYG/exec';

    function logout() { if(confirm("ต้องการออกจากระบบใช่หรือไม่?")) window.location.href = 'index.html'; }

    async function fetchData() {
        const tbody = document.getElementById('tbody');
        const thead = document.getElementById('thead');
        
        try {
            const response = await fetch(SCRIPT_URL);
            const data = await response.json();
            
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" style="text-align:center; padding: 40px;">ไม่พบข้อมูลในชีต (กรุณากรอกข้อมูลผ่านหน้า index ก่อน)</td></tr>';
                return;
            }

            // สร้างหัวตารางอัตโนมัติจากข้อมูลที่ได้รับจริง
            const headers = Object.keys(data[0]);
            thead.innerHTML = `<tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr>`;

            // นับสถิติ
            const total = data.length;
            const success = data.filter(i => {
                const s = String(i['สถานะ'] || '').trim();
                return s.includes('เสร็จ') || s.includes('สำเร็จ');
            }).length;

            document.getElementById('totalCount').innerText = total;
            document.getElementById('successCount').innerText = success;
            document.getElementById('pendingCount').innerText = total - success;

            // แสดงแถวข้อมูล (เรียงจากใหม่ไปเก่า)
            tbody.innerHTML = [...data].reverse().map(item => {
                const cells = headers.map(h => {
                    let val = item[h] || '-';
                    if (h === 'สถานะ') {
                        let cls = String(val).includes('เสร็จ') ? 'badge-success' : 'badge-pending';
                        return `<td><span class="badge ${cls}">${val}</span></td>`;
                    }
                    // ถ้าเป็นวันที่ ให้จัดรูปแบบ
                    if (String(val).includes('T') && String(val).includes('Z')) {
                        return `<td>${new Date(val).toLocaleString('th-TH')}</td>`;
                    }
                    return `<td>${val}</td>`;
                }).join('');
                return `<tr>${cells}</tr>`;
            }).join('');

        } catch (e) {
            console.error(e);
            tbody.innerHTML = '<tr><td colspan="10" style="text-align:center; color:red; padding: 40px;">❌ เกิดข้อผิดพลาด: ไม่สามารถเชื่อมต่อกับ Google Apps Script ได้<br><small>ตรวจสอบการ Deploy ว่าเลือกเป็น "Anyone" หรือยัง?</small></td></tr>';
        }
    }
    
    fetchData();
    // อัปเดตข้อมูลทุกๆ 1 นาทีอัตโนมัติ
    setInterval(fetchData, 60000);
</script>
</body>
</html>
