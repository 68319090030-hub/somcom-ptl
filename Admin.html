<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - 68319090030</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --sidebar: #1e293b;
            --primary: #6366f1;
            --success: #10b981;
            --warning: #f59e0b;
        }
        * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; }
        body { margin: 0; background: #f8fafc; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 260px; background: var(--sidebar); color: white; display: flex; flex-direction: column; }
        .sidebar-header { padding: 40px 20px; text-align: center; background: rgba(0,0,0,0.2); font-weight: 600; font-size: 1.2rem; }
        .sidebar-menu { list-style: none; padding: 20px 0; flex-grow: 1; }
        .sidebar-menu li { padding: 15px 25px; cursor: pointer; transition: all 0.2s; color: #94a3b8; display: flex; align-items: center; }
        .sidebar-menu li:hover { background: #334155; color: white; }
        .btn-logout { background: #ef4444; border: none; color: white; padding: 15px; cursor: pointer; font-weight: 600; }
        
        /* Main Content */
        .main { flex-grow: 1; overflow-y: auto; padding: 40px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        
        /* Stats */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; margin-bottom: 40px; }
        .stat-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; }
        .stat-card p { margin: 0; color: #64748b; font-size: 0.9rem; font-weight: 600; }
        .stat-card h3 { margin: 10px 0 0 0; font-size: 2.5rem; color: var(--sidebar); }
        
        /* Table */
        .table-container { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th { text-align: left; padding: 15px; color: #64748b; border-bottom: 2px solid #f1f5f9; font-weight: 600; }
        td { padding: 18px 15px; border-bottom: 1px solid #f1f5f9; color: #334155; }
        
        /* Status Badge */
        .badge { padding: 6px 12px; border-radius: 10px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .badge-pending { background: #fef3c7; color: #b45309; }
        .badge-success { background: #dcfce7; color: #15803d; }
        
        .refresh-btn { 
            background: var(--primary); color: white; border: none; padding: 12px 24px; 
            border-radius: 12px; cursor: pointer; font-weight: 600; transition: 0.3s;
        }
        .refresh-btn:hover { background: #4f46e5; transform: scale(1.05); }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">🛠 Admin Dashboard</div>
    <ul class="sidebar-menu">
        <li onclick="location.reload()">หน้าหลัก Dashboard</li>
        <li onclick="window.open('https://docs.google.com/spreadsheets/d/11UR1jOdk9Y-kwnladUPyo_svZYIlDpQEbfACpUgieWU/edit')">เปิด Google Sheets</li>
    </ul>
    <button class="btn-logout" onclick="logout()">ออกจากระบบ</button>
</div>

<div class="main">
    <div class="top-bar">
        <h2 style="margin:0; color:#1e293b;">ข้อมูลการแจ้งซ่อม</h2>
        <button class="refresh-btn" onclick="fetchData()">🔄 รีเฟรชข้อมูล</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><p>รายการทั้งหมด</p><h3 id="totalCount">0</h3></div>
        <div class="stat-card"><p>รอดำเนินการ</p><h3 id="pendingCount" style="color:var(--warning)">0</h3></div>
        <div class="stat-card"><p>ดำเนินการแล้ว</p><h3 id="successCount" style="color:var(--success)">0</h3></div>
    </div>

    <div class="table-container">
        <table>
            <thead id="thead"></thead>
            <tbody id="tbody">
                <tr><td colspan="10" style="text-align:center; padding: 50px; color:#64748b;">⏳ กำลังโหลดข้อมูล...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyVgRPIEk-LH6BugpopSlssv0r301J-dHIkAUgsCIZ4BqnLj30x4-eN0NoWJhCH7hYG/exec';

    function logout() { if(confirm("ต้องการออกจากระบบใช่หรือไม่?")) window.location.href = 'index.html'; }

    async function fetchData() {
        try {
            const response = await fetch(SCRIPT_URL);
            const data = await response.json();
            
            if (!data || data.length === 0) {
                document.getElementById('tbody').innerHTML = '<tr><td colspan="10" style="text-align:center;">ไม่มีข้อมูลแจ้งซ่อม</td></tr>';
                return;
            }

            const total = data.length;
            const success = data.filter(i => i['สถานะ'] === 'เสร็จสิ้น' || i['สถานะ'] === 'เสร็จแล้ว').length;
            document.getElementById('totalCount').innerText = total;
            document.getElementById('pendingCount').innerText = total - success;
            document.getElementById('successCount').innerText = success;

            const headers = Object.keys(data[0]);
            document.getElementById('thead').innerHTML = `<tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr>`;

            const rows = data.reverse().map(item => {
                const cells = headers.map(h => {
                    let val = item[h] || '-';
                    if (h === 'สถานะ') {
                        let cls = (val.includes('เสร็จ')) ? 'badge-success' : 'badge-pending';
                        return `<td><span class="badge ${cls}">${val}</span></td>`;
                    }
                    return `<td>${val}</td>`;
                }).join('');
                return `<tr>${cells}</tr>`;
            }).join('');
            
            document.getElementById('tbody').innerHTML = rows;
        } catch (e) {
            document.getElementById('tbody').innerHTML = '<tr><td colspan="10" style="text-align:center; color:red;">❌ ไม่สามารถดึงข้อมูลได้</td></tr>';
        }
    }
    fetchData();
</script>
</body>
</html>
