<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - ระบบจัดการงานซ่อม</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; }
        body { margin: 0; background: #f4f7f6; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background: #2c3e50; color: white; display: flex; flex-direction: column; }
        .sidebar-header { padding: 30px 20px; text-align: center; background: #1a252f; font-weight: 600; font-size: 1.2rem; }
        .sidebar-menu { list-style: none; padding: 0; flex-grow: 1; }
        .sidebar-menu li { padding: 15px 25px; cursor: pointer; transition: 0.3s; border-left: 4px solid transparent; }
        .sidebar-menu li:hover { background: #34495e; border-left: 4px solid #764ba2; }
        .main-content { flex-grow: 1; overflow-y: auto; padding: 40px; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
        .stat-card h3 { font-size: 2.5rem; margin: 10px 0; color: #764ba2; }
        .table-box { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th { background: #f8f9fa; padding: 15px; text-align: left; border-bottom: 2px solid #eee; }
        td { padding: 15px; border-bottom: 1px solid #eee; }
        .status-badge { padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; background: #eee; }
        .success { background: #d4edda; color: #155724; }
        .pending { background: #fff3cd; color: #856404; }
        .btn-refresh { padding: 10px 20px; background: #764ba2; color: white; border: none; border-radius: 8px; cursor: pointer; }
        .btn-logout { background: #e74c3c; color: white; border: none; padding: 15px; cursor: pointer; font-weight: 600; margin-top: auto; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">🛠 แผงควบคุม Admin</div>
    <ul class="sidebar-menu">
        <li onclick="location.reload()">🏠 หน้าหลัก Dashboard</li>
        <li onclick="window.open('https://docs.google.com/spreadsheets/d/11UR1jOdk9Y-kwnladUPyo_svZYIlDpQEbfACpUgieWU/edit', '_blank')">📊 เปิด Google Sheets</li>
    </ul>
    <button class="btn-logout" onclick="logout()">ออกจากระบบ</button>
</div>

<div class="main-content">
    <div class="header-flex">
        <h2 style="margin:0;">รายงานการแจ้งซ่อม</h2>
        <button class="btn-refresh" onclick="fetchData()">🔄 อัปเดตข้อมูล</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><p>งานทั้งหมด</p><h3 id="totalCount">0</h3></div>
        <div class="stat-card"><p>รอดำเนินการ</p><h3 id="pendingCount" style="color: #f39c12;">0</h3></div>
        <div class="stat-card"><p>เสร็จสิ้นแล้ว</p><h3 id="successCount" style="color: #27ae60;">0</h3></div>
    </div>

    <div class="table-box">
        <table>
            <thead id="tableHead"></thead>
            <tbody id="tableBody">
                <tr><td colspan="10" style="text-align: center; padding: 40px;">⏳ กำลังโหลดข้อมูล...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/a/macros/ptl.ac.th/s/AKfycby1-4vwqIpClhE_imDzEXponFWoO69DBfHcI_eJ9fnb5-EJ38PPrQDr-NxpKD740862/exec';

    function logout() {
        if(confirm("คุณต้องการออกจากระบบและกลับสู่หน้าหลักใช่หรือไม่?")) {
            window.location.href = 'index.html';
        }
    }

    async function fetchData() {
        try {
            const response = await fetch(SCRIPT_URL);
            const data = await response.json();
            if (!data || data.length === 0) {
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="10" style="text-align: center;">ไม่มีข้อมูล</td></tr>';
                return;
            }
            const total = data.length;
            const success = data.filter(item => item['สถานะ'] === 'เสร็จสิ้น' || item['สถานะ'] === 'เสร็จแล้ว').length;
            document.getElementById('totalCount').innerText = total;
            document.getElementById('pendingCount').innerText = total - success;
            document.getElementById('successCount').innerText = success;

            const headers = Object.keys(data[0]);
            document.getElementById('tableHead').innerHTML = `<tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr>`;

            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            data.reverse().forEach(item => {
                const row = document.createElement('tr');
                headers.forEach(h => {
                    const cell = document.createElement('td');
                    let val = item[h] || '-';
                    if (h === 'สถานะ') {
                        let cls = (val === 'เสร็จสิ้น' || val === 'เสร็จแล้ว') ? 'success' : (val === 'รอดำเนินการ' ? 'pending' : '');
                        cell.innerHTML = `<span class="status-badge ${cls}">${val}</span>`;
                    } else {
                        cell.innerText = val;
                    }
                    row.appendChild(cell);
                });
                tbody.appendChild(row);
            });
        } catch (error) {
            document.getElementById('tableBody').innerHTML = '<tr><td colspan="10" style="text-align: center; color: red;">❌ โหลดข้อมูลไม่สำเร็จ</td></tr>';
        }
    }
    fetchData();
</script>
</body>
</html>
